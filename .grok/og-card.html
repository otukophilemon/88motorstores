<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GARII</title>
<style>
@font-face {
  font-family: "Barlow Condensed";
  src: url("og-fonts/barlow-condensed-700.woff2") format("woff2");
  font-weight: 700; font-style: normal; font-display: block;
}
@font-face {
  font-family: "Barlow Condensed";
  src: url("og-fonts/barlow-condensed-500.woff2") format("woff2");
  font-weight: 500; font-style: normal; font-display: block;
}
@font-face {
  font-family: "Barlow";
  src: url("og-fonts/barlow-400.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: block;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #0c0b0a; }
.card {
  position: relative;
  width: 1200px; height: 630px;
  background:
    radial-gradient(ellipse 80% 40% at 50% 56%, #3a2c22 0%, transparent 62%),
    linear-gradient(180deg, #0c0b0a 0%, #100e0c 38%, #1c1713 54%, #2c241c 58%, #161410 61%, #0c0b0a 100%);
  color: #f3f0ea;
  font-family: "Barlow Condensed", "Liberation Sans Narrow", sans-serif;
}
.sky-dust {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 18%, rgba(243,240,234,0.16), transparent 2px),
    radial-gradient(1px 1px at 28% 10%, rgba(243,240,234,0.10), transparent 2px),
    radial-gradient(1.4px 1.4px at 63% 14%, rgba(214,209,199,0.14), transparent 2px),
    radial-gradient(1px 1px at 81% 22%, rgba(243,240,234,0.09), transparent 2px),
    radial-gradient(1px 1px at 47% 8%, rgba(243,240,234,0.12), transparent 2px),
    radial-gradient(1.2px 1.2px at 91% 11%, rgba(214,209,199,0.10), transparent 2px);
}
.lockup {
  position: absolute;
  left: 50%; top: 72px;
  transform: translateX(-50%);
  text-align: center;
  width: 780px;
  z-index: 5;
}
.lockup h1 {
  font-size: 172px;
  font-weight: 700;
  letter-spacing: 0.09em;
  line-height: 0.8;
  color: #f3f0ea;
  text-indent: 0.09em;
}
.lockup .rule {
  display: block;
  width: 64px; height: 1px;
  background: #d6d1c7;
  margin: 18px auto 0;
}
.lockup p {
  margin-top: 14px;
  font-family: "Barlow", "Barlow Condensed", sans-serif;
  font-weight: 400;
  font-size: 21px;
  letter-spacing: 0.24em;
  color: #d6d1c7;
  text-indent: 0.24em;
}
.scene-svg { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; z-index: 2; }
.vignette {
  position: absolute; inset: 0; z-index: 6; pointer-events: none;
  background: radial-gradient(ellipse 76% 70% at 50% 48%, transparent 42%, rgba(12,11,10,0.62) 100%);
}
.grain {
  position: absolute; inset: 0; z-index: 7; pointer-events: none;
  opacity: 0.2; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.94  0 0 0 0 0.91  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
</style>
</head>
<body>
<div class="card">
  <div class="sky-dust"></div>
  <svg class="scene-svg" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tarmac" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a1714"/><stop offset="1" stop-color="#0c0b0a"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="0.2" y2="1">
        <stop offset="0" stop-color="#4a453e"/><stop offset="0.4" stop-color="#1c1916"/><stop offset="1" stop-color="#0c0b0a"/>
      </linearGradient>
      <linearGradient id="paint" x1="0.15" y1="0" x2="0.7" y2="1">
        <stop offset="0" stop-color="#2e2924"/><stop offset="0.45" stop-color="#161412"/><stop offset="1" stop-color="#0c0b0a"/>
      </linearGradient>
      <linearGradient id="hoodg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3d3730"/><stop offset="0.5" stop-color="#1a1714"/><stop offset="1" stop-color="#10100e"/>
      </linearGradient>
      <linearGradient id="faceg" x1="0" y1="0" x2="1" y2="0.8">
        <stop offset="0" stop-color="#2a2622"/><stop offset="1" stop-color="#12100e"/>
      </linearGradient>
      <radialGradient id="lamp" cx="35%" cy="40%" r="70%">
        <stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#f3f0ea"/><stop offset="1" stop-color="#a8a196"/>
      </radialGradient>
      <filter id="blur8"><feGaussianBlur stdDeviation="7"/></filter>
      <clipPath id="bodyClip">
        <path d="M 118 188
                 C 112 188, 102 194, 98 204
                 L 86 250 L 90 268
                 L 148 270
                 C 148 270, 156 214, 204 214
                 C 252 214, 260 270, 260 270
                 L 430 270
                 C 430 270, 438 208, 496 208
                 C 554 208, 564 272, 564 272
                 L 678 274 L 734 252 L 742 214
                 C 738 196, 722 186, 700 180
                 L 548 168 L 470 112 L 200 120 L 142 176 Z"/>
      </clipPath>
    </defs>

    <!-- escarpment -->
    <path d="M0 366 C 160 350 280 360 400 348 C 540 334 700 352 1200 342 L 1200 392 L 0 392 Z" fill="#14110e"/>
    <!-- acacias -->
    <g fill="#0c0b0a">
      <ellipse cx="78" cy="340" rx="58" ry="13"/>
      <ellipse cx="58" cy="332" rx="30" ry="8"/>
      <ellipse cx="102" cy="333" rx="24" ry="7"/>
      <rect x="74" y="340" width="5" height="34" rx="1"/>
      <ellipse cx="1128" cy="338" rx="64" ry="14"/>
      <ellipse cx="1106" cy="328" rx="32" ry="9"/>
      <ellipse cx="1154" cy="330" rx="26" ry="8"/>
      <rect x="1124" y="338" width="6" height="38" rx="1"/>
      <ellipse cx="196" cy="350" rx="20" ry="6"/>
      <rect x="194" y="350" width="3" height="16"/>
      <ellipse cx="1008" cy="352" rx="16" ry="5"/>
      <rect x="1006" y="352" width="3" height="14"/>
    </g>
    <g fill="#d6d1c7">
      <rect x="428" y="352" width="3" height="8" opacity="0.32"/>
      <rect x="436" y="348" width="2" height="12" opacity="0.2"/>
      <rect x="448" y="354" width="4" height="6" opacity="0.26"/>
      <rect x="708" y="350" width="2" height="10" opacity="0.22"/>
      <rect x="716" y="346" width="3" height="14" opacity="0.16"/>
      <rect x="508" y="349" width="2" height="9" opacity="0.28"/>
    </g>

    <polygon points="0,376 1200,376 1200,630 0,630" fill="url(#tarmac)"/>
    <polygon points="240,376 960,376 1200,630 0,630" fill="#f3f0ea" opacity="0.028"/>
    <g stroke="#d6d1c7" fill="none" stroke-linecap="butt">
      <path d="M 220 630 L 548 382" stroke-width="2.6" opacity="0.2"/>
      <path d="M 980 630 L 652 382" stroke-width="2.6" opacity="0.2"/>
    </g>
    <g fill="#f3f0ea" opacity="0.36">
      <polygon points="596,616 604,616 602.5,592 597.5,592"/>
      <polygon points="597.2,570 602.8,570 601.7,548 598.3,548"/>
      <polygon points="598,530 602,530 601.3,512 598.7,512"/>
      <polygon points="598.6,496 601.4,496 600.9,482 599.1,482"/>
      <polygon points="599,468 601,468 600.7,456 599.3,456"/>
      <polygon points="599.3,442 600.7,442 600.5,432 599.5,432"/>
      <polygon points="599.5,420 600.5,420 600.35,412 599.65,412"/>
    </g>
    <rect x="0" y="376" width="1200" height="1.5" fill="#2a241e"/>

    <ellipse cx="608" cy="548" rx="360" ry="26" fill="#000" opacity="0.5" filter="url(#blur8)"/>

    <!-- SUV -->
    <g transform="translate(196, 278)">
      <!-- far wheels -->
      <g transform="translate(628, 228) scale(0.72, 0.78)">
        <ellipse cx="0" cy="0" rx="52" ry="54" fill="#0c0b0a"/>
        <ellipse cx="0" cy="0" rx="32" ry="33" fill="#1a1816" stroke="#d6d1c7" stroke-width="2.4"/>
        <ellipse cx="0" cy="0" rx="10" ry="10" fill="#0c0b0a"/>
      </g>
      <g transform="translate(150, 222) scale(0.55, 0.62)">
        <ellipse cx="0" cy="0" rx="52" ry="54" fill="#0c0b0a"/>
        <ellipse cx="0" cy="0" rx="32" ry="33" fill="#181614" stroke="#d6d1c7" stroke-width="2"/>
      </g>

      <!-- main body -->
      <path d="M 118 188
               C 112 188, 102 194, 98 204
               L 86 250 L 90 268
               L 148 270
               C 148 270, 156 214, 204 214
               C 252 214, 260 270, 260 270
               L 430 270
               C 430 270, 438 208, 496 208
               C 554 208, 564 272, 564 272
               L 678 274 L 734 252 L 742 214
               C 738 196, 722 186, 700 180
               L 548 168 L 470 112 L 200 120 L 142 176 Z" fill="url(#paint)"/>

      <!-- hood plane -->
      <path d="M 470 112 L 700 180 L 742 214 L 620 222 L 548 168 L 490 128 Z" fill="url(#hoodg)"/>
      <path d="M 500 132 L 680 192" stroke="#f3f0ea" stroke-width="1.1" opacity="0.16"/>
      <path d="M 518 122 L 650 174" stroke="#d6d1c7" stroke-width="0.7" opacity="0.28"/>

      <!-- front face -->
      <path d="M 700 180 L 790 204 L 798 230 L 780 262 L 734 252 L 742 214 Z" fill="url(#faceg)"/>
      <rect x="752" y="208" width="38" height="26" rx="2.5" fill="#0c0b0a"/>
      <g stroke="#d6d1c7" stroke-width="1.15" opacity="0.8">
        <line x1="758" y1="214" x2="784" y2="214"/>
        <line x1="758" y1="221" x2="784" y2="221"/>
        <line x1="758" y1="228" x2="784" y2="228"/>
      </g>
      <!-- skid plate -->
      <path d="M 734 252 L 780 262 L 764 274 L 708 268 Z" fill="#d6d1c7" opacity="0.7"/>
      <path d="M 738 256 L 770 264 L 758 270 L 714 266 Z" fill="#141210"/>

      <!-- LED DRL bar -->
      <path d="M 728 186 L 792 206 L 790 214 L 724 194 Z" fill="url(#lamp)"/>
      <path d="M 730 190 L 786 208 L 785 212 L 728 194 Z" fill="#f3f0ea"/>
      <rect x="676" y="200" width="28" height="5" rx="1.2" fill="#f3f0ea"/>

      <!-- greenhouse -->
      <path d="M 156 176 L 200 120 L 470 112 L 548 168 L 490 176 L 184 184 Z" fill="url(#glass)"/>
      <path d="M 164 174 L 206 126 L 462 118 L 532 168 L 488 174 L 186 182 Z"
            fill="none" stroke="#d6d1c7" stroke-width="2.4"/>
      <!-- pillars -->
      <path d="M 462 118 L 470 112 L 548 168 L 532 168 Z" fill="#141210"/>
      <path d="M 308 118 L 316 176" stroke="#d6d1c7" stroke-width="2.2" opacity="0.55"/>
      <path d="M 164 174 L 156 176 L 142 176 L 186 182 Z" fill="#12100e"/>
      <path d="M 218 128 L 292 124 L 300 168 L 230 170 Z" fill="#f3f0ea" opacity="0.06"/>
      <!-- roof rails -->
      <path d="M 198 118 L 454 110" stroke="#d6d1c7" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M 206 114 L 446 106" stroke="#0c0b0a" stroke-width="1.3"/>

      <!-- side mirror -->
      <path d="M 530 168 L 562 158 L 572 164 L 568 176 L 536 180 Z" fill="#1a1816"/>
      <path d="M 536 162 L 566 154 L 568 162 L 540 170 Z" fill="#d6d1c7" opacity="0.55"/>
      <!-- belt / character -->
      <path d="M 150 186 L 490 176 L 676 206" fill="none" stroke="#d6d1c7" stroke-width="1.3" opacity="0.4"/>
      <path d="M 148 198 L 670 214" fill="none" stroke="#f3f0ea" stroke-width="0.6" opacity="0.12"/>
      <!-- door cuts -->
      <path d="M 316 176 L 312 268" stroke="#0c0b0a" stroke-width="1.5"/>
      <path d="M 430 174 L 428 268" stroke="#0c0b0a" stroke-width="1.5"/>
      <rect x="350" y="196" width="24" height="5" rx="1.4" fill="#d6d1c7"/>
      <!-- side step -->
      <path d="M 262 270 L 430 270 L 428 278 L 264 278 Z" fill="#141210"/>
      <path d="M 266 272 L 426 272" stroke="#d6d1c7" stroke-width="0.9" opacity="0.4"/>

      <!-- near rear wheel -->
      <g transform="translate(204, 258)">
        <ellipse cx="0" cy="0" rx="56" ry="58" fill="#0c0b0a"/>
        <ellipse cx="0" cy="0" rx="52" ry="54" fill="#171614" stroke="#2a2622" stroke-width="4"/>
        <ellipse cx="0" cy="0" rx="33" ry="34" fill="#1c1916" stroke="#d6d1c7" stroke-width="3.1"/>
        <ellipse cx="0" cy="0" rx="12" ry="12.5" fill="#0c0b0a"/>
        <g stroke="#d6d1c7" stroke-width="1.35" opacity="0.72">
          <line x1="0" y1="-27" x2="0" y2="-14"/>
          <line x1="0" y1="14" x2="0" y2="27"/>
          <line x1="-27" y1="0" x2="-14" y2="0"/>
          <line x1="14" y1="0" x2="27" y2="0"/>
          <line x1="-19" y1="-19" x2="-11" y2="-11"/>
          <line x1="11" y1="11" x2="19" y2="19"/>
        </g>
      </g>
      <!-- near front wheel -->
      <g transform="translate(496, 260)">
        <ellipse cx="0" cy="0" rx="60" ry="62" fill="#0c0b0a"/>
        <ellipse cx="0" cy="0" rx="56" ry="58" fill="#171614" stroke="#2a2622" stroke-width="4"/>
        <ellipse cx="0" cy="0" rx="35" ry="36" fill="#1c1916" stroke="#d6d1c7" stroke-width="3.3"/>
        <ellipse cx="0" cy="0" rx="13" ry="13.5" fill="#0c0b0a"/>
        <g stroke="#d6d1c7" stroke-width="1.45" opacity="0.78">
          <line x1="0" y1="-29" x2="0" y2="-15"/>
          <line x1="0" y1="15" x2="0" y2="29"/>
          <line x1="-29" y1="0" x2="-15" y2="0"/>
          <line x1="15" y1="0" x2="29" y2="0"/>
          <line x1="-20" y1="-20" x2="-12" y2="-12"/>
          <line x1="12" y1="12" x2="20" y2="20"/>
        </g>
      </g>

      <!-- arch lips (thin aluminum, not heavy black) -->
      <path d="M 148 248 C 148 196, 260 194, 260 250" fill="none" stroke="#d6d1c7" stroke-width="1.4" opacity="0.45"/>
      <path d="M 436 250 C 436 188, 556 186, 564 254" fill="none" stroke="#d6d1c7" stroke-width="1.4" opacity="0.45"/>
    </g>

    <!-- wet reflection -->
    <g transform="matrix(1,0,0,-0.26,196,816)" opacity="0.3">
      <path d="M 118 188 L 86 250 L 90 268 L 678 274 L 734 252 L 742 214 L 700 180 L 548 168 L 470 112 L 200 120 L 142 176 Z" fill="#1a1816"/>
      <ellipse cx="204" cy="258" rx="56" ry="58" fill="#0c0b0a"/>
      <ellipse cx="496" cy="260" rx="60" ry="62" fill="#0c0b0a"/>
    </g>
  </svg>

  <div class="lockup">
    <h1>GARII</h1>
    <span class="rule"></span>
    <p>Kenya’s automotive nation</p>
  </div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>
</body>
</html>
